apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: hotel-rating
spec:
  selector:
    app: config-server
  ports:
    - port: 8086
      targetPort: 8086
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: hotel-rating
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: hotel-rating/config-server:latest
          imagePullPolicy: Always
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-registry:8084/eureka
            - name: SPRING_CLOUD_CONFIG_SERVER_GIT_URI
              value: https://github.com/Adarsh345/microservice-tutorial-config
          ports:
            - containerPort: 8086
