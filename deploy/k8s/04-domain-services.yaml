---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: hotel-rating
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: hotel-rating
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: hotel-rating/user-service:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://mongo:27017
            - name: SPRING_DATA_MONGODB_DATABASE
              value: USER_SERVICE
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8086/
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-registry:8084/eureka
          ports:
            - containerPort: 8081
