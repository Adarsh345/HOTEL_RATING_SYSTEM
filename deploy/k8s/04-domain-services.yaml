apiVersion: v1
kind: Service
metadata:
  name: hotel-service
  namespace: hotel-rating
spec:
  selector:
    app: hotel-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
  namespace: hotel-rating
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-service
  template:
    metadata:
      labels:
        app: hotel-service
    spec:
      containers:
        - name: hotel-service
          image: hotel-rating/hotel-service:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://mongo:27017
            - name: SPRING_DATA_MONGODB_DATABASE
              value: HOTEL_SERVICE
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-registry:8084/eureka
          ports:
            - containerPort: 8082
---
